<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="DM Mono, ui-monospace, monospace" font-size="13">
  <rect width="1200" height="720" fill="#faf4ea"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a0610"/></marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e84f22"/></marker>
  </defs>
  <text x="40" y="52" font-family="Fraunces, Georgia, serif" font-size="30" fill="#2a0610">Clockwrit — how an answer is made</text>
  <text x="40" y="78" fill="#6e1a2c">solid = runs in production · dashed = human step</text>

  <!-- sources -->
  <rect x="40" y="110" width="250" height="230" rx="10" fill="#fff" stroke="#2a0610"/>
  <text x="58" y="138" font-weight="bold" fill="#2a0610">Original sources (90)</text>
  <text x="58" y="164" fill="#1f6b35">§ primary — statutes, decrees,</text>
  <text x="58" y="182" fill="#1f6b35">  gazettes, proclamations</text>
  <text x="58" y="206" fill="#6e1a2c">† secondary — IANA tzdata NEWS,</text>
  <text x="58" y="224" fill="#6e1a2c">  vendor notices</text>
  <text x="58" y="248" fill="#e84f22">‡ community — news, wikis,</text>
  <text x="58" y="266" fill="#e84f22">  holiday libraries</text>
  <text x="58" y="300" fill="#2a0610">phase A: the law first</text>
  <text x="58" y="320" fill="#2a0610">phase B: then the internet</text>

  <!-- dataset -->
  <rect x="380" y="110" width="330" height="230" rx="10" fill="#4a0d1c"/>
  <text x="398" y="138" font-weight="bold" fill="#f1e4cf">Sanity dataset (typed, public)</text>
  <text x="398" y="164" fill="#f1e4cf">instrument  authority · status · dates</text>
  <text x="398" y="184" fill="#f1e4cf">ruleSegment  offset · DST rule · basis[]</text>
  <text x="398" y="204" fill="#f1e4cf">zone · jurisdiction · coverage</text>
  <text x="398" y="224" fill="#f1e4cf">holiday · weekendRegime ·</text>
  <text x="398" y="244" fill="#f1e4cf">workdayOverride · holidaySuspension</text>
  <text x="398" y="268" fill="#ff6a3d">Content Releases = pending laws</text>
  <text x="398" y="292" fill="#f1e4cf">ruling  (written back)</text>
  <text x="398" y="322" fill="rgba(241,228,207,.6)">every regime verified against IANA 2026e</text>

  <!-- KB -->
  <rect x="800" y="110" width="360" height="230" rx="10" fill="#fff" stroke="#2a0610"/>
  <text x="818" y="138" font-weight="bold" fill="#2a0610">Sanity Context Knowledge Base</text>
  <text x="818" y="164" fill="#2a0610">entries with line-level citations</text>
  <text x="818" y="190" fill="#2a0610">issues: conflict · gap · merge</text>
  <text x="818" y="216" fill="#2a0610">instructions: standing decisions</text>
  <text x="818" y="242" fill="#2a0610">that survive every rebuild</text>

  <line x1="290" y1="200" x2="378" y2="200" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M165 340 C 165 380, 980 380, 980 342" fill="none" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="395" fill="#6e1a2c">imported with their authority tier</text>

  <!-- MCP endpoints -->
  <rect x="380" y="430" width="330" height="70" rx="10" fill="#fff" stroke="#2a0610"/>
  <text x="398" y="458" font-weight="bold" fill="#2a0610">Context MCP: clockwrit-catalog</text>
  <text x="398" y="480" fill="#2a0610">groq_query · schema_explorer</text>
  <rect x="800" y="430" width="360" height="70" rx="10" fill="#fff" stroke="#2a0610"/>
  <text x="818" y="458" font-weight="bold" fill="#2a0610">Context MCP: clockwrit-sources</text>
  <text x="818" y="480" fill="#2a0610">knowledge_base_search · _read</text>
  <line x1="545" y1="340" x2="545" y2="428" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="980" y1="340" x2="980" y2="428" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- agent -->
  <rect x="380" y="560" width="780" height="120" rx="10" fill="#ff6a3d"/>
  <text x="400" y="590" font-weight="bold" fill="#1e040b">Agent (AI SDK v7) — explains; code decides</text>
  <text x="400" y="614" fill="#1e040b">legal_time · working_day · audit_schedule  ← deterministic engine over the typed records</text>
  <text x="400" y="636" fill="#1e040b">three clocks: the law · IANA 2026e · this runtime (and your browser, live)</text>
  <text x="400" y="658" fill="#1e040b">surfaces: Ask · Ruling desk · Audit · Drift · Eval · MCP server · CLI · Dashboard app</text>
  <line x1="545" y1="500" x2="545" y2="558" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="980" y1="500" x2="980" y2="558" stroke="#2a0610" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ruling loop -->
  <rect x="40" y="430" width="250" height="250" rx="10" fill="#fff" stroke="#e84f22" stroke-dasharray="6 5"/>
  <text x="58" y="458" font-weight="bold" fill="#e84f22">Ruling loop</text>
  <text x="58" y="484" fill="#2a0610">1 rebuild files a conflict</text>
  <text x="58" y="508" fill="#2a0610">2 agent drafts a ruling,</text>
  <text x="58" y="526" fill="#2a0610">  checked against the dataset</text>
  <text x="58" y="550" fill="#2a0610">3 a person approves</text>
  <text x="58" y="568" fill="#2a0610">  (passcode or Sanity login)</text>
  <text x="58" y="592" fill="#2a0610">4 issue resolved → instruction</text>
  <text x="58" y="616" fill="#2a0610">5 ruling doc written back</text>
  <text x="58" y="648" fill="#6e1a2c">the agent cannot apply</text>
  <text x="58" y="666" fill="#6e1a2c">a ruling on its own</text>
  <path d="M800 260 C 600 260, 330 300, 292 470" fill="none" stroke="#e84f22" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#f)"/>
  <path d="M292 600 C 330 600, 340 560, 378 610" fill="none" stroke="#e84f22" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#f)"/>
</svg>
